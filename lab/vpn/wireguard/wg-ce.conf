# WireGuard config - Customer Edge (initiator)
# Tunnel: CE 10.200.0.1 <-> PoP 10.200.0.2
# Transport: CE eth1 (100.64.0.1) -> PoP eth0 (100.65.0.2)
#
# Key generation (run once, do not commit private keys):
#   wg genkey | tee ce_private.key | wg pubkey > ce_public.key
#   wg genkey | tee pop_private.key | wg pubkey > pop_public.key
#
# SATCOM considerations:
#   - MTU 1280 to handle SATCOM overhead (1500 - 80 WG overhead - 140 SATCOM overhead)
#   - PersistentKeepalive 25s to maintain NAT bindings across SATCOM link resets
#   - DNS pushed through tunnel to avoid split-DNS leaks

[Interface]
# Replace with actual private key from: cat ce_private.key
PrivateKey = REPLACE_WITH_CE_PRIVATE_KEY
Address = 10.200.0.1/30
ListenPort = 51820
# Correct MTU is critical: SATCOM links have high overhead
# 1280 = safe minimum (IPv6 minimum MTU, handles all SATCOM/IPsec overhead)
MTU = 1280
# Route all traffic through tunnel (full-tunnel mode)
# For split-tunnel, change to specific subnets
PostUp = ip route add 192.168.100.0/24 dev %i
PostDown = ip route del 192.168.100.0/24 dev %i 2>/dev/null || true

[Peer]
# PoP router public key
PublicKey = REPLACE_WITH_POP_PUBLIC_KEY
# Cloud VPC and PoP management ranges through tunnel
AllowedIPs = 192.168.100.0/24, 172.16.0.0/30, 10.200.0.2/32
Endpoint = 100.65.0.2:51820
# Required for SATCOM: satellite links reset frequently, keepalive maintains session
PersistentKeepalive = 25
