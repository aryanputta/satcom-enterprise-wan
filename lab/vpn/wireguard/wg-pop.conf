# WireGuard config - Cloud PoP (responder)
# Accepts connections from enterprise CE routers

[Interface]
PrivateKey = REPLACE_WITH_POP_PRIVATE_KEY
Address = 10.200.0.2/30
ListenPort = 51820
MTU = 1280
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT

[Peer]
# Customer Edge public key
PublicKey = REPLACE_WITH_CE_PUBLIC_KEY
AllowedIPs = 10.10.0.0/24, 10.200.0.1/32
# No Endpoint needed on PoP side (CE is the initiator)
# PersistentKeepalive not needed on server side
