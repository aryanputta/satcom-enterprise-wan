! FRRouting configuration - Cloud VPC Router
! ASN 65002 (iBGP with PoP) | VPC: 192.168.100.0/24

frr version 9.1
hostname cloud-router
log syslog informational
!
interface eth0
 description "Cloud interconnect - toward PoP router"
 ip address 172.16.0.2/30
!
interface eth1
 description "VPC - application server subnet"
 ip address 192.168.100.1/24
!
router bgp 65002
 bgp router-id 172.16.0.2
 bgp log-neighbor-changes
 !
 ! iBGP peer with PoP router
 neighbor 172.16.0.1 remote-as 65002
 neighbor 172.16.0.1 description "PoP Router (iBGP)"
 !
 address-family ipv4 unicast
  network 192.168.100.0/24
  neighbor 172.16.0.1 activate
  neighbor 172.16.0.1 soft-reconfiguration inbound
  neighbor 172.16.0.1 route-map EXPORT-VPC out
 exit-address-family
!
ip prefix-list VPC-SUBNET seq 5 permit 192.168.100.0/24
!
route-map EXPORT-VPC permit 10
 match ip address prefix-list VPC-SUBNET
!
ip route 0.0.0.0/0 172.16.0.1
!
line vty
!
