! FRRouting configuration - Customer Edge Router
! ASN 65001 | LAN: 10.10.0.0/24 | WAN: 100.64.0.0/30
! BGP peering with PoP router (ASN 65002) over SATCOM WAN

frr version 9.1
hostname ce-router
log syslog informational
!
interface eth0
 description "LAN - enterprise-lan 10.10.0.0/24"
 ip address 10.10.0.1/24
!
interface eth1
 description "WAN - SATCOM uplink to satcom-wan emulator"
 ip address 100.64.0.1/30
!
! BGP: CE router advertises customer LAN prefix to PoP
router bgp 65001
 bgp router-id 100.64.0.1
 bgp log-neighbor-changes
 !
 neighbor 100.65.0.2 remote-as 65002
 neighbor 100.65.0.2 description "Cloud PoP Router"
 neighbor 100.65.0.2 timers 10 30
 neighbor 100.65.0.2 timers connect 15
 !
 address-family ipv4 unicast
  network 10.10.0.0/24
  neighbor 100.65.0.2 activate
  neighbor 100.65.0.2 soft-reconfiguration inbound
  neighbor 100.65.0.2 route-map EXPORT-TO-POP out
  neighbor 100.65.0.2 route-map IMPORT-FROM-POP in
 exit-address-family
!
! Only export customer LAN prefix
ip prefix-list CUSTOMER-LAN seq 5 permit 10.10.0.0/24
!
route-map EXPORT-TO-POP permit 10
 match ip address prefix-list CUSTOMER-LAN
 set community 65001:100
!
route-map IMPORT-FROM-POP permit 10
 set local-preference 100
!
ip route 0.0.0.0/0 100.64.0.2
!
line vty
!
