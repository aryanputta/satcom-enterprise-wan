! FRRouting configuration - Cloud PoP Router
! ASN 65002 | WAN toward CE: 100.65.0.0/30 | Cloud: 172.16.0.0/30

frr version 9.1
hostname pop-router
log syslog informational
!
interface eth0
 description "WAN - toward SATCOM emulator (CE side)"
 ip address 100.65.0.2/30
!
interface eth1
 description "Cloud interconnect - toward cloud-router"
 ip address 172.16.0.1/30
!
router bgp 65002
 bgp router-id 100.65.0.2
 bgp log-neighbor-changes
 !
 ! eBGP peer with Customer Edge
 neighbor 100.64.0.1 remote-as 65001
 neighbor 100.64.0.1 description "Customer Edge Router"
 neighbor 100.64.0.1 timers 10 30
 !
 ! iBGP peer with Cloud Router (same AS 65002)
 neighbor 172.16.0.2 remote-as 65002
 neighbor 172.16.0.2 description "Cloud VPC Router (iBGP)"
 neighbor 172.16.0.2 next-hop-self
 !
 address-family ipv4 unicast
  network 100.65.0.0/30
  !
  neighbor 100.64.0.1 activate
  neighbor 100.64.0.1 soft-reconfiguration inbound
  neighbor 100.64.0.1 route-map IMPORT-FROM-CE in
  !
  neighbor 172.16.0.2 activate
  neighbor 172.16.0.2 route-reflector-client
 exit-address-family
!
route-map IMPORT-FROM-CE permit 10
 set local-preference 150
!
ip route 0.0.0.0/0 100.65.0.1
!
line vty
!
